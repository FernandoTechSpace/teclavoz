[project]
name = "teclavoz"
version = "0.1.0"
description = "Teste de digitação estilo 10fastfingers, com voz e tema do Omarchy"
requires-python = ">=3.11,<3.14"
dependencies = ["textual>=8", "piper-tts>=1.3"]

[project.scripts]
teclavoz = "teclavoz.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teclavoz"]
